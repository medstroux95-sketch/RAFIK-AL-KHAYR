<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 220" width="100%" height="100%">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f2b48" />
      <stop offset="100%" stop-color="#1b4965" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5D061" />
      <stop offset="50%" stop-color="#E5A93C" />
      <stop offset="100%" stop-color="#C58A24" />
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Group Logo Mark -->
  <g transform="translate(185, 10)">
    <!-- Letters R and A monogram -->
    <!-- R part -->
    <path d="M 15 80 L 15 10 L 45 10 C 62 10 72 20 72 35 C 72 48 64 56 50 59 L 75 80 L 58 80 L 36 60 L 31 60 L 31 80 Z M 31 23 L 31 47 L 44 47 C 52 47 57 43 57 35 C 57 27 52 23 44 23 Z" fill="url(#primaryGrad)" />
    
    <!-- A part -->
    <path d="M 60 80 L 85 10 L 102 10 L 127 80 L 110 80 L 102 57 L 78 57 L 75 66 L 93 66 L 93 80 Z M 83 44 L 97 44 L 90 23 Z" fill="url(#primaryGrad)" />
    
    <!-- Airplane Swoop Trail -->
    <path d="M 20 72 Q 70 65 110 32 Q 130 16 142 5" fill="none" stroke="url(#primaryGrad)" stroke-width="4.5" stroke-linecap="round" />
    
    <!-- Airplane icon at the tip -->
    <g transform="translate(142, 5) rotate(-35) scale(0.9)">
      <path d="M 0 -12 L 4 -3 L 14 0 L 4 3 L 3 10 L 0 8 L -2 10 L -1 3 L -11 0 L -1 -3 Z" fill="url(#primaryGrad)" />
    </g>
  </g>

  <!-- Arabic Name: رفيق الخير -->
  <text x="250" y="138" font-family="'Cairo', 'Tajawal', 'Amiri', 'Traditional Arabic', sans-serif" font-size="34" font-weight="800" text-anchor="middle" fill="#0f2b48" letter-spacing="1">
    رفـيـق الخـيـر
  </text>

  <!-- Decorative line & English: RAFIQ AL KHAIR -->
  <g transform="translate(100, 155)">
    <line x1="15" y1="5" x2="80" y2="5" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round" />
    <text x="150" y="9" font-family="'Cairo', 'Montserrat', sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#0f2b48" letter-spacing="4">
      RAFIQ AL KHAIR
    </text>
    <line x1="220" y1="5" x2="285" y2="5" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Tagline: للسفر و السياحة -->
  <g transform="translate(170, 185)">
    <rect x="0" y="0" width="160" height="24" rx="12" fill="#0f2b48" />
    <text x="80" y="16" font-family="'Cairo', 'Tajawal', sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#F5D061">
      للسفر و السياحة
    </text>
  </g>
</svg>
